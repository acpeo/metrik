name: Windows build (fork)

# 本 fork 的云端构建门：push 即跑测试 + 构建 Windows 安装包（NSIS exe），
# 产物挂在 Actions run 的 Artifacts 里下载。
# 上游 release.yml 只在维护者打 tag 时跑，且需要更新器签名私钥；本工作流
# 禁用更新器产物，不需要任何密钥。

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: win-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
        shell: bash

      - name: UI regression tests
        run: npm test
        shell: bash

      - name: Format (auto-fix, then verify)
        run: |
          cargo fmt
          git diff --exit-code --stat || (echo 'rustfmt changed files; continuing with formatted tree (fork build mode)' && exit 0)
        working-directory: src-tauri
        shell: bash

      - name: Clippy
        run: cargo clippy -- -D warnings
        working-directory: src-tauri
        shell: bash

      # Windows 进程树夹具需要真实启动预算，串行跑（与上游 ci.yml 同理由）。
      - name: Rust tests
        env:
          RUST_TEST_THREADS: 1
        run: cargo test
        working-directory: src-tauri
        shell: bash

      - name: Build Windows installer (NSIS)
        # 禁用更新器产物：fork 构建没有签名私钥，updater json 缺私钥会失败。
        run: >-
          npm run desktop:build --
          --config '{"bundle":{"createUpdaterArtifacts":false}}'
        shell: bash

      - name: Locate artifacts
        id: artifacts
        shell: bash
        run: |
          set -e
          find src-tauri/target/release/bundle -type f \( -name '*.exe' -o -name '*.zip' \) | tee artifact-list.txt

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: metrik-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
